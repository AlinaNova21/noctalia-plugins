# SS14 Status — live status for a configurable list of Space Station 14 servers.
id = "alinas/ss14-status"
name = "SS14 Status"
version = "0.1.0"
plugin_api = 24 # 18: panel.setWantsSecondTicks; 24: runAsync arg-array form
author = "alina"
license = "MIT"
dependencies = []
tags = ["games", "ss14", "server"]
icon = "plane"
description = "Live status of your SS14 servers: bar widget, tooltip, and panel."

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "list"
entry = "panel.luau"
width = 380
height = 440
placement = "floating"
position = "auto"
open_near_click = true

[[service]]
id = "poll"
entry = "service.luau"

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
default = 30
min = 5
max = 600

[[setting]]
key = "show_count"
type = "bool"
label_key = "settings.show_count.label"
default = true

[[setting]]
key = "steam_appid"
type = "string"
label_key = "settings.steam_appid.label"
default = "1255460"

[[setting]]
key = "launcher_db_path"
type = "file"
label_key = "settings.launcher_db_path.label"
default = "~/.local/share/Space Station 14/launcher/settings.db"